# Tout LUCAS démarre avec `docker compose up -d`. Le fichier .env est facultatif.
# Les ports sont publiés sur 127.0.0.1 : rien n'est exposé au réseau local.
name: lucas

services:
  ollama:
    image: ollama/ollama:latest
    container_name: lucas-ollama
    restart: unless-stopped
    # Aucun port publié : l'API d'Ollama contournerait les protections de LUCAS.
    environment:
      # Réponses écrites en même temps ; chacune occupe de la mémoire.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      # Deux modèles chargés ensemble dépassent 8 Go : le moteur était alors tué.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      # Mémoire de discussion deux fois plus compacte.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Sans borne, ce cache (en Mo) finit par faire tuer le moteur faute de mémoire.
      LLAMA_ARG_CACHE_RAM: ${LLAMA_ARG_CACHE_RAM:-512}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Télécharge le modèle par défaut au premier démarrage, puis s'arrête.
  # S'il est déjà présent, aucun accès à Internet n'est nécessaire.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.1:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama show "$$MODEL" >/dev/null 2>&1 || ollama pull "$$MODEL"']

  # Interface et API de LUCAS. Pas d'authentification : ne pas exposer au réseau.
  lucas-core:
    build:
      context: .
      dockerfile: crates/lucas-core/Dockerfile
      target: core
    container_name: lucas-core
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.1:8b}
    volumes:
      - lucas_data:/data
      - lucas_uploads:/uploads
    ports:
      - "127.0.0.1:${LUCAS_PORT:-8080}:8000"

  # Examine les fichiers joints, à l'écart : sans réseau, sans les données de
  # LUCAS, en lecture seule hormis le dossier d'échange.
  lucas-sandbox:
    build:
      context: .
      dockerfile: crates/lucas-core/Dockerfile
      target: sandbox
    container_name: lucas-sandbox
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1
    volumes:
      - lucas_uploads:/uploads

volumes:
  ollama_data:
  lucas_data:
  lucas_uploads:
