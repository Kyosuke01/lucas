version: 2
updates:
  # Dépendances GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "preprod"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "chore"
    commit-message:
      prefix: "chore(ci)"

  # Dépendances Rust
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "preprod"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Dépendances Docker
  - package-ecosystem: "docker"
    directory: "/crates/lucas-core"
    target-branch: "preprod"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
