name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, preprod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: node --check crates/lucas-core/ui/app.js && node --check crates/lucas-core/ui/companion.js

  test:
    name: 🧪 Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --locked

  docker:
    name: 🐳 Docker
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build lucas-core

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: 📝 Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Sans paquet à installer : le format attendu est `type(cible): description`.
      - name: Vérifier les messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          format='^(feat|fix|refactor|style|perf|test|docs|chore)(\([a-z0-9-]+\))?!?: .+'
          bad=$(git log --no-merges --format=%s "$BASE..$HEAD" | grep -Ev "$format" || true)
          if [ -n "$bad" ]; then
            printf 'Messages non conformes :\n%s\n' "$bad"
            exit 1
          fi
